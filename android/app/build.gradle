plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jplife.app'
    compileSdk 35
    defaultConfig {
        applicationId "com.jplife.app"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
}